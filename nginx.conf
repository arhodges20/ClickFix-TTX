user www-data;
worker_processes auto;
daemon off;
error_log /dev/stderr;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format cf '$remote_addr - [$time_local] "$request" $status '
                  '$body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout cf;

    sendfile on;

    server {
        listen 0.0.0.0:80;
        root /var/www/html;

        # beacons 404 by design - query strings still logged (that's your console)
        location / { try_files $uri $uri/ =404; }
    }
}
